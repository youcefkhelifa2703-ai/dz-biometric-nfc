name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Files
        run: |
          flutter create --org com.dz.nfc --project-name dz_biometric_nfc .
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DZ-Biometric-NFC-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
