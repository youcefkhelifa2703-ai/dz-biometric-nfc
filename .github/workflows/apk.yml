name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Clean Android Project & Restore Code
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          cp lib/main.dart /tmp/backup/main.dart
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          rm -rf android lib pubspec.yaml pubspec.lock
          flutter create --org com.dz.nfc --project-name dz_biometric_nfc .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DZ-Biometric-NFC-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
